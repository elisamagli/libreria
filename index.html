<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mia libreria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efede8;
    --ink: #1b1a18;
    --muted: #77736b;
    --line: #d9d5cc;
    --shelf: #c9c3b6;
    --ease: cubic-bezier(.2,.8,.2,1);
    --serif: "Cormorant Garamond", "Didot", Georgia, serif;
    --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: var(--sans); min-height: 100vh; overflow-x: hidden; }

  h1 { font-family: var(--serif); font-weight: 500; text-align: center; font-size: clamp(24px, 4.2vw, 40px); line-height: 1; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; margin: 22px 16px 8px; }
  .stats { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: .04em; }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 14px; margin: 16px 16px 0; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .controls button { font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 0; padding: 4px 0; color: var(--muted); cursor: pointer; border-bottom: 1px solid transparent; }
  .controls button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .controls .sep { width: 1px; height: 12px; background: var(--line); }
  .controls select { font: inherit; letter-spacing: inherit; text-transform: inherit; background: none; border: 0; color: var(--ink); cursor: pointer; }

  /* mensola con frecce */
  .stage { position: relative; margin-top: 10px; padding: 0 56px; }
  .viewport { overflow: hidden; touch-action: pan-y; }
  .track { display: flex; align-items: flex-end; gap: 3px; width: max-content; padding: 30px 24px 0; min-height: 140px; transition: transform .7s var(--ease); }
  .shelf-base { height: 10px; background: linear-gradient(var(--shelf), #b9b2a3); border-radius: 1px; box-shadow: 0 8px 14px -8px rgba(0,0,0,.35); }
  .arrow { position: absolute; top: calc(50% + 10px); width: 38px; height: 38px; margin-top: -19px; border-radius: 50%; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; transition: background .2s, color .2s, opacity .2s; z-index: 3; }
  .arrow:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .arrow:disabled { opacity: .25; cursor: default; }
  .arrow.prev { left: 10px; }
  .arrow.next { right: 10px; }
  .empty { color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 22px; align-self: center; margin: auto; padding: 0 40px; }

  /* libro 3D: --t spessore, --w larghezza copertina, --h altezza */
  .book { position: relative; flex: none; width: var(--t); height: var(--h); margin-left: var(--ml, 0px); padding: 0; border: 0; background: none; cursor: pointer; perspective: 1600px; transform-origin: bottom left; transition: width .7s var(--ease), margin .7s var(--ease), transform .5s var(--ease); animation: rise .6s var(--ease) both; animation-delay: calc(var(--i) * 35ms); }
  @keyframes rise { from { opacity: 0; translate: 0 30px; } }
  .book.lean { transform: rotate(-9deg); }
  .book.open { width: var(--w); margin: 0 26px; transform: none; z-index: 2; }
  .book:focus-visible { outline: none; }
  .box { position: absolute; left: 50%; bottom: 0; width: var(--w); height: var(--h); margin-left: calc(var(--w) / -2); transform-style: preserve-3d; transform: rotateY(90deg); transition: transform .9s var(--ease); }
  .book:not(.open):hover .box, .book:not(.open):focus-visible .box { transform: translateY(-14px) rotateY(90deg); }
  .book.open .box { transform: translateY(-18px) rotateY(14deg); }
  .face { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .front { inset: 0; transform: translateZ(calc(var(--t) / 2)); }
  .back { inset: 0; transform: rotateY(180deg) translateZ(calc(var(--t) / 2)); background: var(--c); }
  .spine, .pages { top: 0; height: 100%; width: var(--t); left: calc(50% - var(--t) / 2); }
  .spine { transform: rotateY(-90deg) translateZ(calc(var(--w) / 2)); background: var(--c); color: var(--tx); box-shadow: inset 2px 0 0 rgba(255,255,255,.12), inset -3px 0 4px rgba(0,0,0,.14); }
  .pages { transform: rotateY(90deg) translateZ(calc(var(--w) / 2)); background: repeating-linear-gradient(90deg, #f6f1e6 0 1px, #e3dccc 1px 2px); }
  .top { left: 0; width: 100%; height: var(--t); top: calc(50% - var(--t) / 2); transform: rotateX(90deg) translateZ(calc(var(--h) / 2)); background: #ece5d6; }
  .book.open .front { box-shadow: 18px 22px 30px -18px rgba(0,0,0,.5); }

  /* testo del dorso: autore e titolo affiancati, 3px dai bordi e 3px tra loro */
  .spine .txt { position: absolute; inset: 10px 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; writing-mode: vertical-rl; text-orientation: sideways; transform: rotate(180deg); overflow: hidden; }
  .spine .t { font-family: var(--serif); font-weight: 600; font-size: var(--fs, 13px); line-height: var(--lh, 13.65px); letter-spacing: .04em; text-align: center; white-space: normal; overflow: hidden; max-width: calc(var(--n, 1) * var(--lh, 13.65px)); min-height: 0; }
  .spine .a { flex: none; font-family: var(--serif); font-weight: 600; font-size: 8.5px; line-height: 1; letter-spacing: .12em; opacity: .85; white-space: nowrap; }
  /* segnalibro dei libri in lettura: nastro rosso pieno, decentrato, con sola ombra portata */
  .spine .ribbon { position: absolute; top: -3px; left: 15%; width: 10px; height: 30px; filter: drop-shadow(1px 2px 1px rgba(0,0,0,.25)); }
  .spine .ribbon::before { content: ""; position: absolute; inset: 0; background: #b3121b; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); }

  .cover { overflow: hidden; background: var(--c); color: var(--tx); display: flex; flex-direction: column; justify-content: space-between; padding: 14% 11%; text-align: center; border-radius: 1px 3px 3px 1px; }
  .cover::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6%; background: linear-gradient(90deg, rgba(0,0,0,.2), transparent); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .cover .ct { font-family: var(--serif); font-weight: 600; text-transform: uppercase; line-height: 1.02; letter-spacing: .02em; font-size: 16px; overflow-wrap: anywhere; }
  .cover .rule { width: 30%; height: 1px; background: currentColor; margin: 0 auto; opacity: .7; }
  .cover .ca { font-size: 8px; letter-spacing: .16em; text-transform: uppercase; }

  /* scheda sotto la mensola */
  .info { max-width: 620px; margin: 22px auto 30px; padding: 0 24px; min-height: 120px; }
  .info .hint { text-align: center; color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 18px; padding-top: 14px; }
  .info .card { display: grid; grid-template-columns: 1fr auto; gap: 8px 32px; animation: fade .5s var(--ease) both; }
  @keyframes fade { from { opacity: 0; translate: 0 8px; } }
  .info .kicker { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .info h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.02; margin: 6px 0 4px; }
  .info .by { font-size: 14px; }
  .info .stars { margin-top: 10px; font-size: 15px; letter-spacing: .12em; color: #c8902a; }
  .info .stars .off { color: var(--line); }
  .info dl { display: grid; grid-template-columns: auto auto; gap: 6px 14px; font-size: 12px; align-content: start; }
  .info dt { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: 10px; padding-top: 2px; }
  .info .tags { display: flex; flex-wrap: wrap; gap: 4px; max-width: 220px; }
  .info .tags span { border: 1px solid var(--line); padding: 1px 7px; border-radius: 99px; font-size: 11px; }
  .info .progress { grid-column: 1 / -1; margin-top: 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .info .bar { height: 3px; background: var(--line); margin-top: 6px; }
  .info .bar i { display: block; height: 100%; background: var(--ink); }
  .info p.ov { grid-column: 1 / -1; font-family: var(--serif); font-size: 17px; line-height: 1.35; }
  .info a.open { grid-column: 1 / -1; justify-self: start; margin-top: 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

  @media (max-width: 560px) {
    .controls .sep { display: none; }
    .stage { padding: 0 40px; }
    .arrow { width: 32px; height: 32px; margin-top: -16px; }
    .arrow.prev { left: 4px; }
    .arrow.next { right: 4px; }
    .track { padding: 30px 12px 0; }
    .info .card { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<h1>La mia libreria</h1>
<p class="stats" id="stats">&nbsp;</p>
<nav class="controls" aria-label="Filtri">
  <button data-f="all" aria-pressed="true">Tutti</button>
  <button data-f="Finished" aria-pressed="false">Letti</button>
  <button data-f="Reading" aria-pressed="false">In lettura</button>
  <button data-f="Not started" aria-pressed="false">Da leggere</button>
  <span class="sep"></span>
  <select id="sort" aria-label="Ordina">
    <option value="created">Per arrivo</option>
    <option value="color">Per colore</option>
    <option value="author">Per autore</option>
    <option value="title">Per titolo</option>
    <option value="rating">Per voto</option>
  </select>
</nav>
<div class="stage">
  <button class="arrow prev" id="prev" aria-label="Libro precedente">←</button>
  <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
  <div class="shelf-base"></div>
  <button class="arrow next" id="next" aria-label="Libro successivo">→</button>
</div>
<section class="info" id="info" aria-live="polite"></section>

<script>
// Colori editoriali: [sfondo, testo]
const PALETTE = [
  ["#e8622c", "#1b1a18"], ["#f4a7c4", "#1b1a18"], ["#1f2b4d", "#efede8"], ["#d8343a", "#f6efe6"],
  ["#e8a33a", "#1b1a18"], ["#26231f", "#efede8"], ["#cfcdc8", "#1b1a18"], ["#2f4fa0", "#efede8"],
  ["#7c8b6a", "#f6efe6"], ["#efe7d6", "#1b1a18"], ["#5b2a3a", "#f3d9c8"], ["#b8c8d8", "#1b2a3a"],
];
const STATUS_IT = { "Finished": "Letto", "Reading": "In lettura", "Not started": "Da leggere" };
const GAP = 3, OPEN_MARGIN = 26;

let books = [], filter = "all", sortBy = "created", list = [], sel = -1, offset = 0;
const coverColors = {};

function hash(s) { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.codePointAt(0), 16777619); return h >>> 0; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function overview(b) { return b.overview && !/^book progress$/i.test(b.overview.trim()) ? b.overview : null; }

const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(s, font, spacing) { measureCtx.font = font; return measureCtx.measureText(s).width + spacing * s.length; }
// Titolo a 13px su una riga, 12px quando va a capo (interlinea 1,05)
const ONE = { fs: 13, lh: 13.65 }, MULTI = { fs: 12, lh: 12.6 };
const MAX_H = 275, INSET = 20 + 8; // 10px sopra e sotto, più un po' d'aria
const AUTHOR_FONT = `600 8.5px "Cormorant Garamond"`;
const dims = {};

// Lunghezza minima di riga con cui il titolo, andando a capo parola per parola, sta in n righe
function titleLength(title, n, fs) {
  const font = `600 ${fs}px "Cormorant Garamond"`;
  const words = title.split(/\s+/).map(w => textWidth(w, font, fs * .04));
  const space = textWidth(" ", font, fs * .04);
  for (let L = Math.ceil(Math.max(...words)); L <= MAX_H - INSET; L += 2) {
    let lines = 1, cur = 0;
    for (const w of words) {
      if (cur && cur + space + w > L) { lines++; cur = w; } else cur += (cur ? space : 0) + w;
    }
    if (lines <= n) return L;
  }
  return null;
}

function spineDims(b) {
  if (dims[b.id]) return dims[b.id];
  const h = hash(b.id + b.title);
  const authorW = b.author ? textWidth(b.author, AUTHOR_FONT, 8.5 * .12) : 0;
  const fixed = 6 + (b.author ? 9 + 3 : 0); // margini 3+3, colonna autore e stacco di 3px
  // Spessore dalle pagine (minimo 34px)
  let T = Math.round(Math.max(34, Math.min(62, 18 + (b.pages || 200) / 9)));
  // Prima prova: titolo su una riga a 13px
  let n = 1, sz = ONE, L = titleLength(b.title, 1, ONE.fs);
  if (L === null) {
    // Non entra in 275px: va a capo a 12px su quante righe stanno nello spessore,
    // e se non bastano il dorso si ingrossa di una riga alla volta, fino a 66px
    sz = MULTI;
    n = Math.max(2, Math.floor((T - fixed) / MULTI.lh));
    T = Math.max(T, Math.ceil(fixed + n * MULTI.lh) + 1);
    L = titleLength(b.title, n, MULTI.fs);
    while (L === null && T < 66) {
      T = Math.min(66, Math.ceil(fixed + (n + 1) * MULTI.lh) + 1);
      n = Math.max(2, Math.floor((T - fixed) / MULTI.lh));
      L = titleLength(b.title, n, MULTI.fs);
    }
  }
  const need = INSET + Math.max(L ?? MAX_H, authorW);
  const H = Math.round(Math.min(MAX_H, Math.max(190 + (h >>> 8) % 48, need)));
  return dims[b.id] = { n, H, T, fs: sz.fs, lh: sz.lh };
}

function looks(b, i) {
  const h = hash(b.id + b.title);
  const [c, tx] = coverColors[b.id] || PALETTE[h % PALETTE.length];
  const { n, H, T, fs, lh } = spineDims(b);
  const lean = i % 7 === 4 && i < list.length - 1;
  return { c, tx, n, fs, lh, H, T, W: Math.round(H * .65), lean, ml: lean ? Math.round(H * .17) : 0 };
}

function coverHTML(b) {
  return `<span class="ct">${esc(b.title)}</span><span class="rule"></span><span class="ca">${esc(b.author || "")}</span>
    ${b.cover ? `<img src="${esc(b.cover)}" alt="" onerror="this.remove()">` : ""}`;
}

function sorted(arr) {
  const pi = b => { const h = hash(b.id + b.title); const c = (coverColors[b.id] || PALETTE[h % PALETTE.length])[0]; return hue(c); };
  const by = {
    created: (a, b) => a.created.localeCompare(b.created),
    title: (a, b) => a.title.localeCompare(b.title, "it"),
    author: (a, b) => (a.author || "").localeCompare(b.author || "", "it") || a.title.localeCompare(b.title, "it"),
    rating: (a, b) => b.rating - a.rating,
    color: (a, b) => pi(a) - pi(b),
  }[sortBy];
  return [...arr].sort(by);
}
function hue(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < .08) return 400 + mx; // grigi e neutri in fondo
  const h = mx === r ? (g - b) / d % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}

function render() {
  const track = document.getElementById("track");
  list = sorted(books.filter(b => filter === "all" || b.status === filter));
  sel = -1; offset = 0;
  track.innerHTML = list.length ? "" : `<p class="empty">Nessun libro qui, per ora.</p>`;
  list.forEach((b, i) => {
    const lk = looks(b, i);
    const el = document.createElement("button");
    el.className = `book${lk.lean ? " lean" : ""}`;
    el.style.cssText = `--i:${i};--c:${lk.c};--tx:${lk.tx};--h:${lk.H}px;--t:${lk.T}px;--w:${lk.W}px;--ml:${lk.ml}px;--n:${lk.n};--fs:${lk.fs}px;--lh:${lk.lh}px`;
    el.setAttribute("aria-label", `${b.title}${b.author ? ", " + b.author : ""}`);
    el.innerHTML = `<span class="box">
      <span class="face front cover">${coverHTML(b)}</span>
      <span class="face back"></span>
      <span class="face pages"></span>
      <span class="face top"></span>
      <span class="face spine">${b.status === "Reading" ? '<span class="ribbon"></span>' : ""}<span class="txt">${b.author ? `<span class="a">${esc(b.author)}</span>` : ""}<span class="t">${esc(b.title)}</span></span></span>
    </span>`;
    el.addEventListener("click", () => select(i === sel ? -1 : i));
    track.appendChild(el);
    if (b.cover && !coverColors[b.id]) sampleColor(b, el);
  });
  layout();
  showInfo();
}

// Il dorso prende il colore dominante più vivace della copertina caricata in Notion
function sampleColor(b, el) {
  const img = new Image();
  img.onload = () => {
    try {
      const S = 32, cv = document.createElement("canvas"); cv.width = cv.height = S;
      const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, S, S);
      const d = cx.getImageData(0, 0, S, S).data;
      const buckets = {};
      for (let i = 0; i < d.length; i += 4) {
        const k = (d[i] >> 5) << 6 | (d[i + 1] >> 5) << 3 | d[i + 2] >> 5;
        const o = buckets[k] || (buckets[k] = { n: 0, r: 0, g: 0, b: 0 });
        o.n++; o.r += d[i]; o.g += d[i + 1]; o.b += d[i + 2];
      }
      let best = null, bestScore = -1;
      for (const o of Object.values(buckets)) {
        const r = o.r / o.n, g = o.g / o.n, bl = o.b / o.n;
        const mx = Math.max(r, g, bl), mn = Math.min(r, g, bl);
        const sat = mx ? (mx - mn) / mx : 0;
        // Bianchi della carta e neri del testo contano poco, i colori pieni molto
        const score = o.n * (0.15 + sat * 1.6) * (mx > 235 && sat < .12 ? .25 : 1) * (mx < 30 ? .4 : 1);
        if (score > bestScore) { bestScore = score; best = [r, g, bl]; }
      }
      const [r, g, bl] = best.map(v => Math.round(v));
      const c = "#" + [r, g, bl].map(v => v.toString(16).padStart(2, "0")).join("");
      const tx = (0.299 * r + 0.587 * g + 0.114 * bl) > 150 ? "#1b1a18" : "#f6efe6";
      coverColors[b.id] = [c, tx];
      el.style.setProperty("--c", c); el.style.setProperty("--tx", tx);
    } catch (e) { /* immagine non leggibile: resta il colore di palette */ }
  };
  img.src = b.cover;
}

// Posizioni calcolate dalle misure finali, così la mensola scorre in parallelo all'animazione
function positions() {
  const els = [...document.querySelectorAll(".book")];
  let x = 24; const out = [];
  els.forEach((el, i) => {
    const lk = looks(list[i], i);
    const open = i === sel;
    const left = x + (open ? OPEN_MARGIN : lk.ml);
    const w = open ? lk.W : lk.T;
    out.push({ left, w });
    x = left + w + (open ? OPEN_MARGIN : 0) + GAP;
  });
  return { out, total: x + 24 - GAP };
}

function layout() {
  const vp = document.getElementById("viewport").clientWidth;
  const { out, total } = positions();
  const max = Math.max(0, total - vp);
  if (sel >= 0) offset = out[sel].left + out[sel].w / 2 - vp / 2;
  offset = Math.min(max, Math.max(0, offset));
  document.getElementById("track").style.transform = `translateX(${-offset}px)`;
  document.querySelectorAll(".book").forEach((el, i) => el.classList.toggle("open", i === sel));
  document.getElementById("prev").disabled = !list.length || sel === 0 || (sel < 0 && offset === 0);
  document.getElementById("next").disabled = !list.length || sel === list.length - 1;
}

function select(i) { sel = i; layout(); showInfo(); }

function step(dir) {
  if (!list.length) return;
  if (sel < 0) {
    // Nessun libro aperto: parte dal primo visibile sulla mensola
    const { out } = positions();
    const first = out.findIndex(p => p.left + p.w > offset);
    return select(dir > 0 ? Math.max(0, first) : Math.max(0, first - 1));
  }
  select(Math.min(list.length - 1, Math.max(0, sel + dir)));
}

function showInfo() {
  const info = document.getElementById("info");
  const b = list[sel];
  if (!b) { info.innerHTML = list.length ? `<p class="hint">Clicca un libro o usa le frecce per sfogliare la mensola</p>` : ""; return; }
  const pct = b.pages ? Math.round(100 * Math.min(1, (b.pagesRead || 0) / b.pages)) : null;
  const stars = b.rating ? `<div class="stars" aria-label="${b.rating} su 5">${"★".repeat(b.rating)}<span class="off">${"★".repeat(5 - b.rating)}</span></div>` : "";
  const fin = b.finished ? new Date(b.finished).toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" }) : null;
  const ov = overview(b);
  info.innerHTML = `<div class="card">
    <div>
      <div class="kicker">${STATUS_IT[b.status] || b.status} · ${sel + 1} di ${list.length}</div>
      <h2>${esc(b.title)}</h2>
      ${b.author ? `<div class="by">${esc(b.author)}</div>` : ""}
      ${stars}
    </div>
    <dl>
      ${b.publisher ? `<dt>Editore</dt><dd>${esc(b.publisher)}</dd>` : ""}
      ${b.pages ? `<dt>Pagine</dt><dd>${b.pages}</dd>` : ""}
      ${fin ? `<dt>Finito il</dt><dd>${fin}</dd>` : ""}
      ${b.genres.length ? `<dt>Genere</dt><dd class="tags">${b.genres.map(g => `<span>${esc(g)}</span>`).join("")}</dd>` : ""}
    </dl>
    ${pct !== null && b.status === "Reading" ? `<div class="progress">Progresso · ${pct}%<div class="bar"><i style="width:${pct}%"></i></div></div>` : ""}
    ${ov ? `<p class="ov">${esc(ov)}</p>` : ""}
    <a class="open" href="${esc(b.url)}" target="_blank" rel="noopener">Apri in Notion →</a>
  </div>`;
}

document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "Escape") select(-1);
});
// Scorrimento col dito sul telefono = frecce
let touchX = null;
const vpEl = document.getElementById("viewport");
vpEl.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
vpEl.addEventListener("touchend", e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
});
vpEl.addEventListener("wheel", e => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) e.preventDefault(); }, { passive: false });
addEventListener("resize", layout);

document.querySelectorAll(".controls button").forEach(btn => btn.addEventListener("click", () => {
  filter = btn.dataset.f;
  document.querySelectorAll(".controls button").forEach(x => x.setAttribute("aria-pressed", x === btn));
  render();
}));
document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; render(); });

// Le misure dei dorsi dipendono dal font: si aspetta che Cormorant sia caricato
const fontsReady = Promise.all([`600 13px "Cormorant Garamond"`, `600 8.5px "Cormorant Garamond"`].map(f => document.fonts.load(f))).catch(() => {});
Promise.all([fetch("books.json?t=" + Date.now()).then(r => r.json()), fontsReady]).then(([data]) => {
  books = data.books;
  const read = books.filter(b => b.status === "Finished").length;
  const reading = books.filter(b => b.status === "Reading").length;
  const pages = books.filter(b => b.status === "Finished").reduce((s, b) => s + (b.pages || 0), 0);
  document.getElementById("stats").textContent = `${books.length} volumi · ${read} letti · ${reading} in lettura · ${pages.toLocaleString("it-IT")} pagine sfogliate`;
  render();
}).catch(() => { document.getElementById("track").innerHTML = `<p class="empty">Impossibile caricare i libri.</p>`; });
</script>
</body>
</html>
