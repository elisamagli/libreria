name: Sincronizza libreria da Notion

on:
  schedule:
    # ogni 30 minuti, ai :07 e ai :37: lontano dall'ora piena, quando GitHub è più carico e ritarda
    - cron: "7,37 * * * *"
  workflow_dispatch:          # pulsante "Run workflow" per aggiornare subito

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow   # per leggere le copertine e calcolare il colore dei dorsi
      - run: python sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Salva libri e copertine se sono cambiati
        run: |
          git config user.name "libreria-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna libreria da Notion"
          # Se nel frattempo il repository è cambiato (es. un nuovo index.html), si riallinea e riprova
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
